# Pertinax technique-level mapping: Promptfoo plugin or strategy -> MITRE ATLAS technique.
#
# Promptfoo maps its plugins to ATLAS *tactics* (catalog/promptfoo.json). This file goes one
# level deeper and names the *techniques* each test exercises, so the ATLAS view can show
# exactly which techniques your inventory has evidence for.
#
# Only list a technique when the test clearly exercises it. Anything not listed here is
# still covered at tactic level through Promptfoo's own mapping. IDs are checked against
# catalog/atlas.json by `npm test`.

